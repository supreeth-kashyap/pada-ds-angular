<button
  type="button"
  class="info-tooltip__trigger"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-describedby]="tooltipId"
  (focus)="onFocus()"
  (blur)="onBlur()"
>
  <ds-info-icon aria-hidden="true" />
</button>
<span class="info-tooltip__popup" role="tooltip" [id]="tooltipId" [hidden]="!open()">{{ data().text }}</span>
