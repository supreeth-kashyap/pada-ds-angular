@if (data().src) {
  <img class="avatar__image" [src]="data().src" [alt]="data().alt" />
} @else if (data().initials) {
  <span class="avatar__initials" [attr.aria-label]="data().alt">{{ data().initials }}</span>
} @else {
  <svg
    class="avatar__icon"
    [attr.aria-label]="data().alt"
    role="img"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 16 16"
    fill="currentColor"
  >
    <path d="M8 7a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
    <path d="M1.5 14s-.5 0-.5-.5c0-2 1.5-4.5 7-4.5s7 2.5 7 4.5c0 .5-.5.5-.5.5h-13z" />
  </svg>
}
