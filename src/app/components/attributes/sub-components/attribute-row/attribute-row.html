<div class="attr-row__key">
  <span class="attr-row__key-text">{{ data().key }}</span>
  @if (data().tooltip; as tooltip) {
    <ds-info-tooltip [data]="{ label: data().key, text: tooltip }" />
  }
</div>

<div class="attr-row__value">
  @for (val of resolvedValues(); track $index) {
    @if (val.kind === 'template') {
      <ng-container [ngTemplateOutlet]="val.template" [ngTemplateOutletContext]="val.context ?? null" />
    } @else {
      <ng-container [ngComponentOutlet]="val.component" [ngComponentOutletInputs]="val.inputs" />
    }
  }
</div>
