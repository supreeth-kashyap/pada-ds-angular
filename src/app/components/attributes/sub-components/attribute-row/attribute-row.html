<div class="attr-row__key">
  <span class="attr-row__key-text">{{ data.key }}</span>
  @if (data.tooltip) {
    <span class="attr-row__tooltip-icon" [title]="data.tooltip" aria-hidden="true">
      <ds-info-icon />
    </span>
  }
</div>

<div class="attr-row__value">
  @for (val of data.value; track $index) {
    @if (isTemplate(val)) {
      <ng-container [ngTemplateOutlet]="val.template" [ngTemplateOutletContext]="val.context ?? null" />
    } @else {
      <ng-container
        [ngComponentOutlet]="resolveComponent(val)"
        [ngComponentOutletInputs]="resolveInputs(val)"
      />
    }
  }
</div>
