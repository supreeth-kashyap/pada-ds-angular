<div class="section-header__title">
  <span class="section-header__label">{{ data().label }}</span>
  @if (data().tooltip; as tooltip) {
    <ds-info-tooltip [data]="{ label: data().label, text: tooltip }" />
  }
</div>

@if (data().slot?.length) {
  <div class="section-header__slot">
    @for (item of data().slot; track $index) {
      @if (item.type === 'button') {
        <ds-button
          [data]="{ label: item.label, disabled: item.disabled }"
          (clicked)="slotClicked.emit(item)"
        />
      } @else if (item.type === 'badge') {
        <ds-badge [data]="{ label: item.label }" />
      }
    }
  </div>
}
