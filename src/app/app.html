<main>
  <h1>Badge</h1>
  <div class="showcase">
    @for (badge of badges; track badge.label) {
      <ds-badge [data]="badge" />
    }
  </div>

  <h1>Avatar</h1>
  <div class="showcase">
    @for (avatar of avatars; track avatar.alt) {
      <ds-avatar [data]="avatar" />
    }
  </div>

  <h1>Button</h1>
  <div class="showcase">
    @for (button of buttons; track button.label) {
      <ds-button [data]="button" />
    }
  </div>

  <h1>Attributes</h1>
  <div class="showcase showcase--block">
    <ds-attributes [data]="attributesData" />
  </div>
</main>
