name: Release

# Push a tag that matches projects/pada-ds/package.json (git tag v1.2.0 && git push origin
# v1.2.0) to publish pada-ds-angular to npm and GitHub Packages and create the GitHub Release
# from CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release
  packages: write # publish to GitHub Packages
  id-token: write # npm provenance and trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm 11.5 or later.
      - run: npm install -g npm@11

      - run: npm ci

      - name: Check the tag matches the library version
        run: |
          version="$(node -p "require('./projects/pada-ds/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match projects/pada-ds/package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm run tokens:check
      - run: npm run lint
      - run: npm run test:lib
      - run: npm run build:lib

      # Skips a version that is already on npm, so a failed run can be re-run.
      - name: Publish to npm
        working-directory: dist/pada-ds-angular
        run: |
          if npm view "pada-ds-angular@$VERSION" version > /dev/null 2>&1; then
            echo "pada-ds-angular@$VERSION is already on npm"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # GitHub Packages only takes scoped names; this is what the repo's Packages panel lists.
      - name: Publish to GitHub Packages
        working-directory: dist/pada-ds-angular
        run: |
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" >> "$NPM_CONFIG_USERCONFIG"
          npm pkg set name=@supreeth-kashyap/pada-ds-angular
          if npm view "@supreeth-kashyap/pada-ds-angular@$VERSION" version --registry=https://npm.pkg.github.com > /dev/null 2>&1; then
            echo "@supreeth-kashyap/pada-ds-angular@$VERSION is already on GitHub Packages"
          else
            npm publish --registry=https://npm.pkg.github.com
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the GitHub Release
        run: |
          # This version's section of CHANGELOG.md, without its heading.
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          printf '\n**npm:** [`pada-ds-angular@%s`](https://www.npmjs.com/package/pada-ds-angular/v/%s)\n' "$VERSION" "$VERSION" >> release-notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "Pada for Angular $GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
