version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # The framework packages pin each other's exact version as peers, so they move together
      # across dependencies and devDependencies. Listed first: a package joins the first group it matches.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      dev-dependencies:
        dependency-type: development
      dependencies:
        dependency-type: production
