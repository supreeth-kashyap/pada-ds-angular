<div
  dsField
  class="password-input-field"
  [controlId]="inputId()"
  [invalid]="invalid()"
  [required]="isRequired()"
  [disabled]="isDisabled()"
>
  <label dsFieldLabel class="password-input-label">
    {{ label() }}
    @if (isRequired()) {
      <span class="password-input-required" aria-hidden="true">*</span>
    }
    @if (optional()) {
      <span class="password-input-optional">(optional)</span>
    }
  </label>
  <div class="password-input" [attr.data-size]="size()" [attr.data-disabled]="flag(isDisabled())">
    <input
      dsFieldControl
      class="password-input-input"
      autocapitalize="none"
      spellcheck="false"
      [type]="visible() ? 'text' : 'password'"
      [value]="value()"
      [attr.autocomplete]="autocomplete()"
      [attr.placeholder]="placeholder() ?? null"
      [attr.name]="name() ?? null"
      (input)="handleInput($event)"
      (blur)="handleBlur($event)"
    />
    <button
      type="button"
      class="password-input-toggle"
      aria-label="Show password"
      [attr.aria-pressed]="visible()"
      [attr.aria-controls]="inputId()"
      [disabled]="isDisabled()"
      (click)="visible.set(!visible())"
    >
      <ds-icon [name]="visible() ? 'hidden' : 'visible'" [size]="16" />
    </button>
  </div>
  @if (score() !== null) {
    <div class="password-strength" [attr.data-score]="score()">
      <div
        role="meter"
        class="password-strength-bars"
        aria-label="Password strength"
        aria-valuemin="0"
        aria-valuemax="4"
        [attr.aria-valuenow]="score()"
        [attr.aria-valuetext]="scoreLabel()"
      >
        @for (bar of bars; track bar) {
          <span class="password-strength-bar" [attr.data-filled]="flag(bar <= score()!)"></span>
        }
      </div>
      <span class="password-strength-label" aria-hidden="true">{{
        value() ? scoreLabel() : ''
      }}</span>
    </div>
  }
  @if (description(); as description) {
    <p dsFieldDescription class="password-input-description">{{ description }}</p>
  }
  @if (error(); as error) {
    <p dsFieldError class="password-input-error">{{ error }}</p>
  }
</div>
