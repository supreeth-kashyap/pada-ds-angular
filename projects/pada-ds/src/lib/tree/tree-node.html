<div dsTreeItemRow class="tree-row">
  <span dsTreeItemIndicator class="tree-indicator">
    <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
      <path
        d="M6 4l4 4-4 4"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </span>
  @if (node().icon; as icon) {
    <ds-icon class="tree-icon" [name]="icon" [size]="16" />
  }
  <span dsTreeItemLabel class="tree-label">
    @if (content(); as content) {
      <ng-container *ngTemplateOutlet="content.template; context: { $implicit: node() }" />
    } @else {
      {{ node().label }}
    }
  </span>
</div>
@if (item.open()) {
  <div dsTreeGroup class="tree-group">
    @for (child of node().children; track child.value) {
      <div
        [dsTreeNode]="child"
        [content]="content()"
        [value]="child.value"
        [expandable]="!!child.children?.length"
        [disabled]="!!child.disabled"
      ></div>
    }
  </div>
}
