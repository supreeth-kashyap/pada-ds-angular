<div class="segment-options" role="tablist" [attr.aria-label]="ariaLabel()">
  @for (option of options(); track option.value; let index = $index) {
    <button
      type="button"
      role="tab"
      class="segment-option"
      [attr.data-index]="index"
      [attr.aria-selected]="option.value === selected()"
      [attr.aria-label]="option.label ? null : (option.ariaLabel ?? option.value)"
      [attr.tabindex]="option.value === selected() ? 0 : -1"
      [disabled]="isDisabled() || !!option.disabled"
      (click)="select(option)"
      (keydown)="handleKeydown($event, index)"
      (blur)="onTouched()"
    >
      @if (option.icon) {
        <ds-icon class="segment-icon" [name]="option.icon" [size]="16" />
      }
      @if (option.label) {
        <span class="segment-label">{{ option.label }}</span>
      }
    </button>
  }
</div>
