<div
  dsField
  class="number-input-field"
  [controlId]="inputId()"
  [invalid]="invalid()"
  [required]="isRequired()"
  [disabled]="isDisabled()"
>
  <label dsFieldLabel class="number-input-label">
    {{ label() }}
    @if (isRequired()) {
      <span class="number-input-required" aria-hidden="true">*</span>
    }
    @if (optional()) {
      <span class="number-input-optional">(optional)</span>
    }
  </label>
  <div
    dsNumberInput
    class="number-input"
    [attr.data-stepper]="stepper()"
    [attr.data-size]="size()"
    [value]="value()"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [largeStep]="largeStep()"
    [formatOptions]="formatOptions()"
    [locale]="locale()"
    [disabled]="isDisabled()"
    [readonly]="readonly()"
    [inputId]="inputId()"
    [name]="name()"
    (valueChange)="handleChange($event)"
  >
    @if (stepper() === 'split') {
      <button dsNumberInputDecrement class="number-input-step">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path
            d="M3 8h10"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
      </button>
    }
    <input
      dsNumberInputInput
      dsFieldControl
      class="number-input-input"
      [attr.placeholder]="placeholder() ?? null"
      (blur)="handleBlur($event)"
    />
    @if (stepper() === 'split') {
      <button dsNumberInputIncrement class="number-input-step">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path
            d="M3 8h10M8 3v10"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
      </button>
    } @else if (stepper() === 'stacked') {
      <span class="number-input-steppers">
        <button dsNumberInputIncrement class="number-input-step">
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
            <path
              d="M4 10l4-4 4 4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <button dsNumberInputDecrement class="number-input-step">
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
            <path
              d="M4 6l4 4 4-4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </span>
    }
  </div>
  @if (description(); as description) {
    <p dsFieldDescription class="number-input-description">{{ description }}</p>
  }
  @if (error(); as error) {
    <p dsFieldError class="number-input-error">{{ error }}</p>
  }
</div>
