<div class="radiogroup">
  @if (label(); as label) {
    <span class="radiogroup-label" [id]="id + '-label'">{{ label }}</span>
  }
  <div
    role="radiogroup"
    class="radiogroup-options"
    [attr.aria-labelledby]="label() ? id + '-label' : null"
    [attr.aria-label]="label() ? null : (ariaLabel() ?? null)"
    [attr.aria-required]="isRequired() || null"
    [attr.aria-disabled]="isDisabled() || null"
  >
    @for (option of options(); track option.value; let index = $index) {
      <div class="radio-option" [attr.data-disabled]="flag(isDisabled() || !!option.disabled)">
        <input
          type="radio"
          class="radio"
          [id]="id + '-' + index"
          [name]="name()"
          [value]="option.value"
          [checked]="value() === option.value"
          [disabled]="isDisabled() || !!option.disabled"
          [required]="isRequired()"
          (change)="select(option.value)"
          (blur)="onTouched()"
        />
        <label class="radio-label" [for]="id + '-' + index">{{ option.label }}</label>
      </div>
    }
  </div>
</div>
